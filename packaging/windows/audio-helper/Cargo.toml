[package]
name = "folia-audio-helper"
version = "0.1.0"
edition = "2021"
description = "Windows WASAPI exclusive-mode pass-through player for Folia (decode, optional high-quality resample, bit-exact output)"
license = "AGPL-3.0"

[dependencies]
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
wasapi = "0.26.0"
windows = { version = "0.62", features = ["Win32_Media_Audio"] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
